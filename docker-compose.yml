version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cryptollm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptollm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptollm}
      POSTGRES_DB: ${POSTGRES_DB:-cryptollm}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cryptollm}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptollm-network

volumes:
  postgres_data:

networks:
  cryptollm-network:
    driver: bridge
